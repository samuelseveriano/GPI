# Build do GPI para Windows x64, em jobs separados:
#   1. testes      — testes automatizados (Windows)
#   2. conectores  — validação REAL das APIs públicas (não bloqueia o build; falhas ficam no relatório)
#   3. build       — GPI.exe (PyInstaller, one-folder) → testes do executável A–H → GPI-Windows-Portable.zip
# Não usa segredos. Em caso de falha, os logs de cada job são publicados como artefato "logs-<job>".
# Versões das actions: checkout@v5 / setup-python@v6 / upload-artifact@v5 usam Node 24
# (as v4/v5 anteriores usam Node 20, descontinuado nos runners do GitHub).
name: windows-build

on:
  push:
    branches: [main, fase4, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  testes:
    name: 1. Testes automatizados
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências (inclui statsmodels, LightGBM e XGBoost)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt -r requirements-dev.txt
      - name: Executar pytest
        shell: pwsh
        run: |
          python -m pytest -q -rfEs --tb=short --junitxml=pytest.xml tests *> pytest.log
          $c = $LASTEXITCODE
          Get-Content pytest.log -Tail 5
          if ($c -ne 0) { $t = (Get-Content pytest.log -Tail 60) -join '%0A'; Write-Output "::error title=pytest::$t"; exit $c }
      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: |
            pytest.log
            pytest.xml
          retention-days: 30

  conectores:
    name: 2. Validação real dos conectores
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar uma amostra real de cada fonte pública
        continue-on-error: true      # APIs externas fora do ar não impedem o build — mas não são declaradas validadas
        timeout-minutes: 25
        run: |
          python scripts/validate_connectors.py validacao_conectores.json --comparar --relatorios=relatorios_reais 2>&1 | tee val.log
          { echo "### Conectores (coleta real)"; echo '```'; cat val.log | cut -c1-180; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=validacao-conectores::$(tail -n 30 val.log | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: validacao-conectores
          path: |
            validacao_conectores.json
            val.log
            relatorios_reais/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: 3. Compilar e testar GPI.exe
    needs: testes
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Assinatura digital opcional: só roda se os segredos forem configurados no repositório
      # (Microsoft Artifact Signing). Sem eles, o build é publicado identificado como NÃO ASSINADO.
      SIGNING_ENABLED: ${{ secrets.SIGN_ENDPOINT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências de build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt "pyinstaller>=6.6,<7"
          pip freeze | Out-File -Encoding utf8 dependencias.txt

      - name: Empacotar GPI.exe (one-folder)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/gpi.spec *> pyi.log
          $c = $LASTEXITCODE
          if ($c -ne 0) { $t = (Get-Content pyi.log -Tail 40) -join '%0A'; Write-Output "::error title=pyinstaller::$t"; exit $c }
          Select-String -Path pyi.log -Pattern "WARNING: (Hidden import|lib not found)" | Select-Object -First 40 | ForEach-Object { $_.Line } | Out-File -Encoding utf8 pyi_avisos.txt

      - name: Assinar GPI.exe (opcional — Microsoft Artifact Signing)
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.SIGN_PROFILE }}
        run: |
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser
          Invoke-TrustedSigning -Endpoint $env:SIGN_ENDPOINT -CodeSigningAccountName $env:SIGN_ACCOUNT `
            -CertificateProfileName $env:SIGN_PROFILE -Files "dist/GPI/GPI.exe" -FileDigest SHA256 `
            -TimestampRfc3161 "http://timestamp.acs.microsoft.com" -TimestampDigest SHA256

      - name: Documentação e manifesto de integridade
        run: python packaging/make_manifest.py dist/GPI

      - name: Verificação com o Microsoft Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { "Microsoft Defender (MpCmdRun) indisponível neste runner" | Out-File -Encoding utf8 defender.txt; exit 0 }
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Host "atualização de assinaturas não disponível: $_" }
          $ver = (Get-MpComputerStatus -ErrorAction SilentlyContinue)
          $out = & $mp -Scan -ScanType 3 -File (Resolve-Path dist/GPI) -DisableRemediation 2>&1
          $code = $LASTEXITCODE
          @("MpCmdRun -Scan -ScanType 3 -File dist/GPI -DisableRemediation", "código de saída: $code (0 = nenhuma ameaça; 2 = ameaça encontrada)",
            "versão das definições: $($ver.AntivirusSignatureVersion) de $($ver.AntivirusSignatureLastUpdated)", "", $out) | Out-File -Encoding utf8 defender.txt
          Get-Content defender.txt
          Write-Output "::notice title=defender::codigo $code (0 = nenhuma ameaca) | definicoes $($ver.AntivirusSignatureVersion) | $(( $out | Select-Object -Last 3) -join ' ')"
          if ($code -eq 2) { Write-Output "::error title=defender::O Defender acusou ameaça no pacote — investigar antes de publicar (ver defender.txt)"; exit 1 }

      - name: Testes do executável (A–H, cópia limpa sem Python no PATH)
        timeout-minutes: 20
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Exe dist/GPI/GPI.exe -Report smoke_resultados.txt

      - name: Relatório de build
        shell: pwsh
        run: |
          $exe = Get-Item dist/GPI/GPI.exe
          $files = (Get-ChildItem -Recurse -File dist/GPI | Measure-Object -Property Length -Sum)
          $pkgs = Get-Content dependencias.txt | Where-Object { $_ -match '^(numpy|scipy|pandas|scikit-learn|statsmodels|lightgbm|xgboost|catboost|river|rapidfuzz|optuna|starlette|uvicorn|pyinstaller)==' }
          $sig = Get-AuthenticodeSignature dist/GPI/GPI.exe
          $report = @(
            "GPI - relatório de build",
            "Commit: $env:GITHUB_SHA",
            "Execução: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Runner: $env:RUNNER_OS $env:RUNNER_ARCH  |  $(python --version)  |  PyInstaller $(pyinstaller --version)",
            "GPI.exe: $([math]::Round($exe.Length/1KB)) KB; pacote: $($files.Count) arquivos, $([math]::Round($files.Sum/1MB,1)) MB",
            "Assinatura digital: $(if ($sig.Status -eq 'Valid') { 'assinado por ' + $sig.SignerCertificate.Subject } else { 'NÃO ASSINADO (' + $sig.Status + ')' })",
            "",
            "Bibliotecas principais:", $pkgs,
            "",
            "Testes automatizados: aprovados (job 1)",
            "Testes do executável:", (Get-Content smoke_resultados.txt)
          )
          New-Item -ItemType Directory -Force dist/GPI/relatorios | Out-Null
          $report | Out-File -Encoding utf8 dist/GPI/relatorios/relatorio_build.txt
          Copy-Item dependencias.txt, selftest.json, defender.txt dist/GPI/relatorios/
          "0.6.1" | Out-File -Encoding ascii -NoNewline dist/GPI/VERSION.txt
          $sigtxt = if ($sig.Status -eq 'Valid') { "assinado: $($sig.SignerCertificate.Subject)" } else { "" }
          $sec = python packaging/security_report.py dist/GPI GPI-Windows-Portable-v0.6.1.zip defender.txt dist/GPI/relatorios/seguranca.md "$sigtxt"
          Write-Output "::notice title=seguranca::$sec | assinatura: $($sig.Status)"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=seguranca::relatório de segurança encontrou problema (credencial embutida ou nível de execução elevado)"; exit 1 }
          $report | Out-File -Encoding utf8 relatorio_build.txt
          "### Build do GPI.exe" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $report >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Gerar GPI-Windows-Portable-v0.6.1.zip e hashes SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GPI -DestinationPath GPI-Windows-Portable-v0.6.1.zip
          $h = @(Get-FileHash dist/GPI/GPI.exe -Algorithm SHA256; Get-FileHash GPI-Windows-Portable-v0.6.1.zip -Algorithm SHA256)
          $h | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Write-Output "::notice title=sha256::$((Get-Content SHA256SUMS.txt) -join ' | ')"
          Copy-Item dist/GPI/relatorios/seguranca.md seguranca.md
          "### Hashes SHA-256" >> $env:GITHUB_STEP_SUMMARY; '```' >> $env:GITHUB_STEP_SUMMARY; Get-Content SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY; '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content seguranca.md >> $env:GITHUB_STEP_SUMMARY
          # integridade do ZIP: extrair numa pasta nova e conferir o hash do executável
          Expand-Archive GPI-Windows-Portable-v0.6.1.zip -DestinationPath zipcheck -Force
          if ((Get-FileHash zipcheck/GPI/GPI.exe).Hash -ne (Get-FileHash dist/GPI/GPI.exe).Hash) { Write-Output "::error title=zip::GPI.exe no ZIP difere do compilado"; exit 1 }
          $ok = (Start-Process zipcheck/GPI/GPI.exe -ArgumentList "--check" -Wait -PassThru).ExitCode
          if ($ok -ne 0) { Write-Output "::error title=zip::verificação de integridade do pacote extraído falhou ($ok)"; exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: GPI-Windows-Portable-v0.6.1
          path: |
            GPI-Windows-Portable-v0.6.1.zip
            SHA256SUMS.txt
            seguranca.md
            relatorio_build.txt
          retention-days: 30

      - name: Preservar logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-build
          path: |
            pyi.log
            pyi_avisos.txt
            defender.txt
            dependencias.txt
            smoke_resultados.txt
            selftest.json
            exemplo_relatorio_exe.pdf
            ${{ runner.temp }}/gpi-smoke-data/logs/
          if-no-files-found: ignore
          retention-days: 30
