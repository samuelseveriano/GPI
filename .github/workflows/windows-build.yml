# Build do GPI para Windows x64: testes → GPI.exe (PyInstaller, one-folder) → testes de
# inicialização → GPI-Windows-Portable.zip publicado como artefato.
# Não usa segredos. Runners gratuitos: ilimitados em repositório público; em repositório
# privado consomem a cota mensal do plano (minutos Windows contam em dobro).
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt pytest "pyinstaller>=6.6,<7"

      - name: Testes automatizados
        shell: pwsh
        run: |
          python -m pytest -q -rfE --tb=short tests *> pytest.log
          $c = $LASTEXITCODE
          if ($c -ne 0) { $t = (Get-Content pytest.log -Tail 60) -join '%0A'; Write-Output "::error title=pytest::$t"; exit $c }

      - name: Validação real dos conectores públicos (runner com internet)
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          python scripts/validate_connectors.py validacao_conectores.json *> val.log
          $t = (Get-Content val.log -Tail 30) -join '%0A'
          Write-Output "::notice title=validacao-conectores::$t"

      - name: Empacotar GPI.exe (one-folder)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/gpi.spec *> pyi.log
          $c = $LASTEXITCODE
          if ($c -ne 0) { $t = (Get-Content pyi.log -Tail 40) -join '%0A'; Write-Output "::error title=pyinstaller::$t"; exit $c }

      - name: Documentação e manifesto de integridade
        run: python packaging/make_manifest.py dist/GPI

      - name: Testes de inicialização do executável
        timeout-minutes: 15
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Exe dist/GPI/GPI.exe

      - name: Gerar GPI-Windows-Portable.zip
        shell: pwsh
        run: Compress-Archive -Path dist/GPI -DestinationPath GPI-Windows-Portable.zip

      - name: Relatório de build
        shell: pwsh
        run: |
          $zip = Get-Item GPI-Windows-Portable.zip
          @"
          GPI - relatório de build
          Commit: $env:GITHUB_SHA
          Runner: $env:RUNNER_OS $env:RUNNER_ARCH
          Python: $(python --version)
          PyInstaller: $(pyinstaller --version)
          Pacote: $($zip.Name) $([math]::Round($zip.Length/1MB,1)) MB
          Testes automatizados: aprovados
          Testes de inicialização do executável: aprovados
          "@ | Out-File -Encoding utf8 relatorio_build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GPI-Windows-Portable
          path: |
            GPI-Windows-Portable.zip
            relatorio_build.txt
            validacao_conectores.json
          retention-days: 30
