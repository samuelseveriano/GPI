# Verificações de segurança do GPI (v0.7). Nenhum job usa segredos do repositório.
#   gitleaks       — varredura de segredos em TODO o histórico (Gitleaks compilado pelo proxy de módulos Go,
#                    com verificação no banco de checksums sum.golang.org) + varredura própria do GPI
#   dependencias   — pip-audit (vulnerabilidades conhecidas) e licenças das bibliotecas
#   codeql         — análise estática (Python e JavaScript)
#   revisao-deps   — revisão das dependências alteradas em pull requests
# Ações fixadas por SHA de commit (tag correspondente no comentário).
name: security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Varredura de segredos (histórico completo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Gitleaks v8.30.1 (todo o histórico)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" version
          # --redact: o relatório nunca contém o valor do segredo
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --report-format json --report-path gitleaks.json \
            --config .gitleaks.toml . && echo "Gitleaks: nenhum segredo encontrado" >> "$GITHUB_STEP_SUMMARY"
      - name: Resumo dos achados (regra, arquivo, linha e commit — nunca o valor)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("gitleaks.json"):
              raise SystemExit
          d = json.load(open("gitleaks.json"))
          print(f"### Gitleaks: {len(d)} achado(s)")
          if d:
              print("| Regra | Arquivo | Linha | Commit | Data |\n|---|---|---|---|---|")
          for f in d:
              print(f"| {f['RuleID']} | {f['File']} | {f['StartLine']} | {f['Commit'][:8]} | {f['Date'][:10]} |")
          PY
      - name: Varredura própria do GPI (histórico + arquivos proibidos)
        run: python3 scripts/secret_scan.py --historico
      - name: Relatório (sem valores)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gitleaks-relatorio
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  dependencias:
    name: Dependências (pip-audit e licenças)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit pip-licenses
          pip install -r requirements.txt -r requirements-optional.txt
          pip-audit -r requirements.txt -r requirements-optional.txt --desc on -f markdown -o pip-audit.md || echo "VULNERABILIDADES=1" >> "$GITHUB_ENV"
          [ -s pip-audit.md ] || echo "pip-audit: nenhuma vulnerabilidade conhecida nas dependências declaradas." > pip-audit.md
          cat pip-audit.md >> "$GITHUB_STEP_SUMMARY"
          pip-licenses --from=mixed --format=markdown --with-urls --order=license > licencas.md
          python scripts/license_check.py licencas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auditoria-dependencias
          path: |
            pip-audit.md
            licencas.md
          retention-days: 30
      - name: Falhar se houver vulnerabilidade conhecida
        if: env.VULNERABILIDADES == '1'
        run: |
          echo "::error title=pip-audit::há dependências com vulnerabilidade conhecida (ver pip-audit.md)"
          exit 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: "/language:${{ matrix.language }}"

  revisao-deps:
    name: Revisão de dependências (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
